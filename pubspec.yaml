name: watchchronos
description: "WatchChronos - Kişisel film ve dizi takip uygulaması."
publish_to: 'none'
version: 1.0.0+1

isar_version: &isar_version 3.3.2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Locale-e özel MaterialLocalizations/WidgetsLocalizations/
  # CupertinoLocalizations (metin seçme araç çubuğu, tarih seçici vb. gibi
  # yerleşik widget'ların dile göre metinleri) için gerekli.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^16.2.0

  # Networking
  dio: ^5.9.0

  # TMDB poster/backdrop görselleri için disk cache'li network image
  cached_network_image: ^3.4.1

  # Fragman (YouTube) ve TMDB sayfasını tarayıcıda açmak için
  url_launcher: ^6.3.1

  # Backend (Supabase)
  supabase_flutter: ^2.10.0

  # Kurulum bilgilerinin (TMDB/Supabase anahtarları) cihazda güvenli saklanması
  flutter_secure_storage: ^9.2.2

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Local database - isar_community is the maintained fork of the
  # now-archived isar/isar package, API compatible with Isar v3.
  isar_community:
    version: *isar_version
  isar_community_flutter_libs:
    version: *isar_version
    
  path_provider: ^2.1.5
  file_picker: ^11.0.2

  # TV Time GDPR ZIP aktarımı (ayarlar > TV Time Verilerini Aktar) için
  archive: ^3.6.1
  csv: ^6.0.0

  # Masaüstünde (Windows/Linux/macOS) başlangıç pencere boyutu ve
  # ortalama için
  window_manager: ^0.5.1

  # Bağlantı bilgilerini (Supabase/TMDB) cihazlar arası QR ile aktarmak
  # için: PC'de "QR göster" (qr_flutter, tüm platformlarda çalışır),
  # mobilde "QR tara" (mobile_scanner, kamera gerektirir — Android/iOS)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.6.0
  freezed: ^3.2.5
  json_serializable: ^6.10.0
  isar_community_generator:
    version: *isar_version

flutter:
  uses-material-design: true

  # İlk kurulumda "İlk defa kuruyorum" seçilirse, bu SQL migration
  # dosyaları Supabase Management API üzerinden kullanıcının kendi
  # projesine uygulanır (bkz. features/setup/data/management_api_service.dart).
  assets:
    - supabase/migrations/

